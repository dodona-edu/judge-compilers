[tool.ruff]
line-length = 120
# Keep in step with .tool-versions; ruff defaults to py310 and can't infer it without a [project] table.
target-version = "py312"
# run has no .py extension, so ruff skips it unless told otherwise.
extend-include = ["run"]

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    # Conflicts with the formatter.
    "COM812",
    # This repo has no copyright headers.
    "CPY001",
    # DodonaException is the name every judge's dodona_command.py uses; renaming it forks the shared module.
    "N818",
    # str(Enum) members: StrEnum changes str() and format() of ErrorType, MessageFormat and friends in the JSON output.
    "UP042",
    # cmake and lit are found on PATH inside the judge image, and their arguments come from the exercise's own files.
    "S603",
    "S607",
    # No docstring convention in this judge, and dodona_command.py stays close to the copy other judges carry.
    "D",
]

[tool.ruff.lint.per-file-ignores]
# assert is fine here.
# tests/ is a pytest rootdir folder, not a package.
"tests/*" = ["S101", "INP001"]

[tool.ty.src]
# ty skips extensionless files, so run is listed by name.
include = [".", "run"]

[tool.pytest.ini_options]
# tests/ has no package, so the judge modules are imported from the repo root.
pythonpath = ["."]
